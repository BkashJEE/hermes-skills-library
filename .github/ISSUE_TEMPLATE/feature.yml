name: Feature request
description: Suggest an improvement to discovery, imports, use cases or contributor tooling.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: evidence
    attributes:
      label: Examples or references
      description: Add links or redacted screenshots when they clarify the request.
  - type: checkboxes
    id: scope
    attributes:
      label: Project fit
      options:
        - label: This preserves Hermes profile isolation and does not require modifying core Hermes files.
          required: true
