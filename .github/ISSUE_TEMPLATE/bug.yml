name: Bug report
description: Report reproducible incorrect behavior in the library or installer.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project. Do not include credentials, private repository content or personal paths.
  - type: input
    id: version
    attributes:
      label: Library version or commit
      placeholder: v0.6.1 or a full commit SHA
    validations:
      required: true
  - type: input
    id: hermes
    attributes:
      label: Hermes version or commit
      placeholder: Full commit SHA when possible
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, tokens, private content and personal paths.
          required: true
        - label: I searched existing issues for this problem.
          required: true
