name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build:preview
      - run: npm run test:community
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML
      - run: python -m unittest test_installer test_stories
      - run: python -m compileall -q dashboard install.py preview test_library.py
